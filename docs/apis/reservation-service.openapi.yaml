openapi: 3.0.3
info:
  title: reservation-service · API de Reservas y Tickets
  version: 1.0.0
  description: |
    Microservicio de Reservas del Sistema de Gestión de Entradas para eventos deportivos.
    Muestra la disponibilidad de asientos de un partido y permite a los clientes reservarlos
    (HU-15, HU-16, HU-22), confirmar la reserva y emitir los tickets con QR (HU-18).

    **Puerto 8083, base `reservation_db`.** El Swagger generado por springdoc-openapi
    (`/swagger-ui.html`) se compara contra este archivo.

    > Estado: `GET /me` y la disponibilidad están implementados (HU-22, HU-15).
    > Reservar y consultar (HU-16), confirmar y ver el QR (HU-18) se escribieron con diseño
    > primero (*design-first*): al cerrar cada HU se compara con `/swagger-ui.html` y, si algo
    > cambió, se actualiza este archivo.

    ## Cómo se relaciona con los otros servicios
    - **auth-service** emite el token. Este servicio **no lo llama**: solo verifica la firma
      con el mismo secreto (`JWT_SECRET`). El `clientId` del cliente sale del claim `clientId`
      del token, **nunca del body**.
    - **match-service** es la fuente de verdad de partidos, estadios y asientos. Este servicio
      lo consulta por REST (timeouts: conexión 2 s, lectura 3 s). Si no responde → `503`.
      La validación de asientos usa el endpoint interno `POST /match-api/v1/internal/seats/validate`,
      protegido con el encabezado `X-Internal-Key` (no lo usa el front ni Apidog).

    ## Reglas de negocio
    | Regla | Origen | Respuesta |
    |---|---|---|
    | Solo el rol CLIENTE reserva; el ADMIN no | Decisión #8 Sprint 0 | `403` |
    | Máximo de entradas por cliente y partido (sumando reservas activas) | Parámetro `MAX_TICKETS_PER_MATCH` = 6 | `422` |
    | Un asiento no puede estar en dos reservas activas | Consulta + `UNIQUE(match_id, seat_id)` | `409` |
    | Solo se reserva en partidos `PROGRAMADO` o `EN_CURSO`, y hasta el cierre de la venta: inicio + `SALES_CLOSE_OFFSET_MINUTES` (HU-40) | match-service + parámetro = 10 | `422` |
    | Los asientos deben pertenecer al estadio del partido | match-service | `404` |
    | La reserva queda `PENDIENTE` y retiene los asientos unos minutos, nunca más allá del cierre de la venta | Parámetro `HOLD_MINUTES` = 10 | — |
    | Las reservas vencidas se liberan al reservar (y luego con la tarea automática, HU-17) | | — |
    | Solo el dueño confirma, y solo si está `PENDIENTE` y no venció | HU-18 | `404` / `409` |
    | Al confirmar, la venta debe seguir abierta (mismo criterio que al reservar) | match-service + parámetro | `422` |
    | Un ticket por asiento, con un código QR aleatorio de 64 caracteres | HU-18 | — |
    | "Mis reservas" solo muestra las del cliente del token; el ADMIN no tiene "mis reservas" | HU-20 | `403` |
    | Cancelar: el dueño o un ADMIN; no si está cancelada, expirada, con entradas usadas (`409`) o el partido ya empezó (`422`) | HU-19 | `404` / `409` / `422` |
    | El cliente cancela una reserva confirmada solo hasta `CANCEL_DEADLINE_HOURS` (24) antes del inicio; el ADMIN no tiene ese límite | HU-45 · parámetro | `422` |
    | Si el partido se cancela, una tarea programada cancela sus reservas activas y anula sus entradas (consistencia eventual, hasta 1 minuto) | HU-46 | — |

    **Asiento ocupado** = vendido (`RESERVED`) **o** retenido (`HELD`) por una reserva que aún no vence.

    ## Convenciones
    - Prefijo `/reservation-api/v1`.
    - Errores en formato RFC 7807 (`application/problem+json`), mensajes en español.
    - `401`/`403` los responde Spring Security sin cuerpo, con `WWW-Authenticate: Bearer`.
    - Las reservas se identifican hacia afuera con `publicId` (UUID), no con el id numérico,
      para que no se puedan enumerar.
    - Fechas y horas en hora de Ecuador (`America/Guayaquil`), formato ISO 8601.

    ## Cómo probar en Apidog
    1. Ten arriba **auth-service (8081)**, **match-service (8082)** y **reservation-service (8083)**.
    2. En auth-service ejecuta `POST /auth-api/v1/auth/login` con un **cliente**
       (`cvera`, `dmorales`, `mlopez`…) y guarda `$.accessToken` en `{{token}}`
       (Post Processors → Extract Variable).
    3. En este servicio usa **Auth → Bearer Token** con `{{token}}`.
    4. Para la prueba del `403`, inicia sesión con `admin`.

    Credenciales de desarrollo: `database/README.md`.
  contact:
    name: Johanna Gutiérrez
servers:
  - url: http://localhost:8083
    description: Desarrollo local

tags:
  - name: Sesión
    description: Datos del token con el que se llama al servicio
  - name: Disponibilidad
    description: Asientos ocupados de un partido (HU-15)
  - name: Reservas
    description: Crear, consultar, confirmar y cancelar reservas (HU-16, HU-18, HU-19)
  - name: Tickets
    description: QR de cada entrada como imagen (HU-18) y entradas en PDF (HU-37)
  - name: Mis reservas
    description: Historial del cliente en JSON y en PDF (HU-20)
  - name: Reportes
    description: Reporte consolidado del administrador con filtros e indicadores de ocupación (HU-21)

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ Sesión
  /reservation-api/v1/me:
    get:
      tags: [Sesión]
      summary: Quién soy (según el token)
      description: |
        Cualquier usuario autenticado (HU-22). Devuelve lo que este servicio lee del JWT, sin
        consultar a auth-service. Sirve para comprobar que la verificación del token funciona
        entre microservicios. `clientId` es `null` para el ADMIN.
      operationId: me
      responses:
        '200':
          description: Datos del token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
              examples:
                cliente:
                  summary: Cliente
                  value: { username: cvera, role: CLIENTE, clientId: 2, expiresAt: '2026-10-21T20:15:00Z' }
                admin:
                  summary: Administrador
                  value: { username: admin, role: ADMIN, clientId: null, expiresAt: '2026-10-21T20:15:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ Disponibilidad
  /reservation-api/v1/matches/{matchId}/availability:
    get:
      tags: [Disponibilidad]
      summary: Asientos ocupados de un partido
      description: |
        Cualquier usuario autenticado (HU-15). Primero confirma con match-service que el partido
        existe; después devuelve **solo los asientos ocupados**, ordenados por `seatId`.
        Todo asiento del estadio que no aparece en la lista está libre.

        - `RESERVED`: vendido (reserva confirmada).
        - `HELD`: retenido por una reserva `PENDIENTE` que todavía no vence.

        `refreshSeconds` (parámetro `AVAILABILITY_REFRESH_SECONDS`) indica al front cada cuántos
        segundos volver a consultar.
      operationId: getAvailability
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: Asientos ocupados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityResponse' }
              examples:
                partido1:
                  summary: Partido 1 recién cargadas las semillas
                  value:
                    matchId: 1
                    matchStatus: PROGRAMADO
                    occupiedSeats:
                      - { seatId: 1, status: RESERVED }
                      - { seatId: 2, status: RESERVED }
                      - { seatId: 3, status: RESERVED }
                      - { seatId: 4, status: RESERVED }
                      - { seatId: 5, status: RESERVED }
                      - { seatId: 6, status: RESERVED }
                      - { seatId: 11, status: RESERVED }
                      - { seatId: 12, status: RESERVED }
                      - { seatId: 35, status: HELD }
                      - { seatId: 36, status: HELD }
                      - { seatId: 37, status: HELD }
                    refreshSeconds: 5
                sinOcupados:
                  summary: Partido 2 (nadie ha reservado)
                  value: { matchId: 2, matchStatus: PROGRAMADO, occupiedSeats: [], refreshSeconds: 5 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: El partido no existe en match-service
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Not Found, status: 404, detail: No existe el partido con el id 99, instance: /reservation-api/v1/matches/99/availability }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ Reservas
  /reservation-api/v1/reservations:
    post:
      tags: [Reservas]
      summary: Reservar asientos
      description: |
        Solo rol **CLIENTE** (HU-16). El cliente se toma del token.

        **Orden de validación**
        1. Rol CLIENTE → si no, `403`.
        2. Body: `matchId` y de 1 a 6 `seatIds` sin repetir → si no, `400`.
        3. match-service: el partido existe, la venta está abierta (`PROGRAMADO` o `EN_CURSO` y antes de
           inicio + `SALES_CLOSE_OFFSET_MINUTES`) y los asientos son de su estadio → `404` / `422` / `503`. Esta llamada se hace **fuera** de la transacción.
        4. Se liberan las reservas `PENDIENTE` vencidas de ese partido (pasan a `EXPIRADA`).
        5. Máximo por cliente y partido (`MAX_TICKETS_PER_MATCH`) → `422`.
        6. Asientos ocupados → `409`. Si dos clientes piden el mismo asiento a la vez, el
           `UNIQUE` de la base deja pasar solo a uno; el otro recibe `409`.
        7. Se crea la reserva `PENDIENTE` con los asientos `HELD` hasta `expiresAt`
           (ahora + `HOLD_MINUTES`, o el cierre de la venta si llega antes) → `201` con encabezado `Location`.

        El código de reserva (`RES-2026-K7P4QX`) es aleatorio, sin caracteres confusos
        (`0/O`, `1/I`), para que no se pueda adivinar y se pueda dictar en boletería.
      operationId: createReservation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReservationRequest' }
            examples:
              valida:
                summary: cvera reserva 2 asientos del partido 1
                value: { matchId: 1, seatIds: [13, 14] }
              otroEstadio:
                summary: Asiento del estadio 2 en un partido del estadio 1 (404)
                value: { matchId: 1, seatIds: [9000] }
              cancelado:
                summary: Partido 6 está CANCELADO (422)
                value: { matchId: 6, seatIds: [50] }
      responses:
        '201':
          description: Reserva creada en estado PENDIENTE
          headers:
            Location:
              schema: { type: string, example: http://localhost:8083/reservation-api/v1/reservations/3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResponse' }
              example:
                publicId: 3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42
                code: RES-2026-K7P4QX
                matchId: 1
                status: PENDIENTE
                createdAt: '2026-10-21T14:30:00'
                expiresAt: '2026-10-21T14:40:00'
                confirmedAt: null
                cancelledAt: null
                seatIds: [13, 14]
                tickets: []
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El token es válido, pero no es de un CLIENTE (el ADMIN no reserva). Sin cuerpo.
        '404':
          description: El partido no existe, o algún asiento no pertenece a su estadio
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                asientos:
                  value: { type: about:blank, title: Not Found, status: 404, detail: 'Estos asientos no existen en el estadio del partido: [200]', instance: /reservation-api/v1/reservations }
                partido:
                  value: { type: about:blank, title: Not Found, status: 404, detail: No existe el partido con el id 99, instance: /reservation-api/v1/reservations }
        '409':
          description: Algún asiento ya está vendido o retenido por otra reserva vigente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Conflict, status: 409, detail: 'Estos asientos ya no están disponibles: [13]', instance: /reservation-api/v1/reservations }
        '422':
          description: El partido no admite reservas, o se supera el máximo de entradas por partido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                maximo:
                  summary: Supera el máximo
                  value: { type: about:blank, title: Unprocessable Content, status: 422, detail: Solo puedes tener 6 entradas por partido. Ya tienes 4 y estás pidiendo 3, instance: /reservation-api/v1/reservations }
                estado:
                  summary: Partido no PROGRAMADO
                  value: { type: about:blank, title: Unprocessable Content, status: 422, detail: El partido está CANCELADO y no admite reservas, instance: /reservation-api/v1/reservations }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /reservation-api/v1/reservations/{publicId}:
    get:
      tags: [Reservas]
      summary: Consultar una reserva
      description: |
        Cualquier usuario autenticado (HU-16). Un **CLIENTE** solo ve sus propias reservas;
        el **ADMIN** ve cualquiera.

        Si la reserva es de otro cliente se responde **`404` y no `403`**: un `403` confirmaría
        que ese `publicId` existe (protección contra IDOR y enumeración).
      operationId: getReservation
      parameters:
        - name: publicId
          in: path
          required: true
          description: Identificador público (UUID) devuelto al crear la reserva
          schema: { type: string, format: uuid, example: 3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42 }
      responses:
        '200':
          description: La reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResponse' }
        '400':
          description: El `publicId` no es un UUID válido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No existe, o pertenece a otro cliente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Not Found, status: 404, detail: No existe la reserva 3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42, instance: /reservation-api/v1/reservations/3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42 }

  /reservation-api/v1/reservations/{publicId}/confirm:
    post:
      tags: [Reservas]
      summary: Confirmar reserva y emitir tickets
      description: |
        Solo rol **CLIENTE**, y solo el dueño de la reserva (HU-18). No hay pasarela de pago:
        confirmar equivale a pagar (simulado). No lleva body.

        **Orden de validación**
        1. Rol CLIENTE → si no, `403`.
        2. La reserva existe y es del cliente del token → si no, `404` (no revela reservas ajenas).
        3. match-service: el partido sigue `PROGRAMADO` (pudo cancelarse mientras el cliente
           decidía) → `422` / `503`. Fuera de la transacción.
        4. La reserva está `PENDIENTE` → si no, `409`.
        5. Todavía no vence (`expiresAt` posterior a ahora) → si no, `409`.
        6. Reserva `CONFIRMADA`, asientos `HELD` → `RESERVED` y **un ticket `ACTIVO` por asiento**.

        **Concurrencia**: la reserva se lee con bloqueo pesimista (`SELECT ... FOR UPDATE`). Si
        llegan dos confirmaciones a la vez (doble clic), la segunda espera y recibe `409`; nunca
        se emiten tickets duplicados.

        **Código QR**: 32 bytes de `SecureRandom` en hexadecimal (64 caracteres). No contiene
        datos personales ni del asiento: en la puerta, el sistema busca el ticket por ese código.
      operationId: confirmReservation
      parameters:
        - $ref: '#/components/parameters/ReservationPublicId'
      responses:
        '200':
          description: Reserva confirmada con sus tickets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResponse' }
              example:
                publicId: 3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42
                code: RES-2026-K7P4QX
                matchId: 1
                status: CONFIRMADA
                createdAt: '2026-10-21T14:30:00'
                expiresAt: '2026-10-21T14:40:00'
                confirmedAt: '2026-10-21T14:34:12'
                cancelledAt: null
                seatIds: [13, 14]
                tickets:
                  - publicId: 7a1d9c3e-2f4b-4e8a-b6c1-0d9e8f7a6b5c
                    seatId: 13
                    qrCode: 9f2c7d1a4b8e4f0a9c3d5e7f1a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b
                    status: ACTIVO
                  - publicId: c2e4a6b8-0d1f-4a3c-9e5b-7d8f0a1b2c3d
                    seatId: 14
                    qrCode: 1b3d5f7a9c0e2a4c6e8a0b2d4f6a8c0e1f3b5d7a9c1e3a5c7e9a1b3d5f7a9c0e
                    status: ACTIVO
        '400':
          description: El `publicId` no es un UUID válido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El token es válido, pero no es de un CLIENTE. Sin cuerpo.
        '404':
          description: No existe, o pertenece a otro cliente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Not Found, status: 404, detail: No existe la reserva 3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42, instance: /reservation-api/v1/reservations/3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42/confirm }
        '409':
          description: La reserva ya no está PENDIENTE, o venció
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                yaConfirmada:
                  summary: Segunda confirmación
                  value: { type: about:blank, title: Conflict, status: 409, detail: La reserva está CONFIRMADA y no se puede confirmar, instance: /reservation-api/v1/reservations/3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42/confirm }
                vencida:
                  summary: Pasaron los minutos de retención
                  value: { type: about:blank, title: Conflict, status: 409, detail: La reserva venció. Vuelve a elegir tus asientos, instance: /reservation-api/v1/reservations/3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42/confirm }
        '422':
          description: El partido dejó de estar PROGRAMADO
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Unprocessable Content, status: 422, detail: El partido está CANCELADO y ya no admite confirmaciones, instance: /reservation-api/v1/reservations/3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42/confirm }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /reservation-api/v1/reservations/{publicId}/cancel:
    post:
      tags: [Reservas]
      summary: Cancelar reserva
      description: |
        **CLIENTE** (solo sus reservas) o **ADMIN** (cualquiera) (HU-19). No lleva body.
        No se borra nada: la reserva queda en el historial como `CANCELADA` (reportes y auditoría).

        **Orden de validación**
        1. La reserva existe y es del cliente del token (el ADMIN ve todas) → si no, `404`.
        2. Si está `CONFIRMADA`: match-service confirma que el partido no está `EN_CURSO` ni
           `FINALIZADO` → si no, `422` (`503` si no responde). Fuera de la transacción.
           Una reserva `PENDIENTE` se cancela aunque match-service esté caído.
        3. Estado `CANCELADA` o `EXPIRADA`, o `PENDIENTE` ya vencida → `409`.
        4. Alguna entrada ya `UTILIZADO` → `409`.
        5. Reserva `CANCELADA` con `cancelledAt`, asientos liberados y tickets `ANULADO` → `200`.

        Se usa el mismo bloqueo pesimista que al confirmar: cancelar, confirmar y la expiración
        automática nunca se pisan.
      operationId: cancelReservation
      parameters:
        - $ref: '#/components/parameters/ReservationPublicId'
      responses:
        '200':
          description: Reserva cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResponse' }
              example:
                publicId: 3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42
                code: RES-2026-K7P4QX
                matchId: 1
                status: CANCELADA
                createdAt: '2026-10-21T14:30:00'
                expiresAt: '2026-10-21T14:40:00'
                confirmedAt: '2026-10-21T14:34:12'
                cancelledAt: '2026-10-22T09:15:40'
                seatIds: []
                tickets:
                  - { publicId: 7a1d9c3e-2f4b-4e8a-b6c1-0d9e8f7a6b5c, seatId: 13, qrCode: 9f2c7d1a4b8e4f0a9c3d5e7f1a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b, status: ANULADO }
                  - { publicId: c2e4a6b8-0d1f-4a3c-9e5b-7d8f0a1b2c3d, seatId: 14, qrCode: 1b3d5f7a9c0e2a4c6e8a0b2d4f6a8c0e1f3b5d7a9c1e3a5c7e9a1b3d5f7a9c0e, status: ANULADO }
        '400':
          description: El `publicId` no es un UUID válido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No existe, o pertenece a otro cliente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Not Found, status: 404, detail: No existe la reserva 3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42, instance: /reservation-api/v1/reservations/3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42/cancel }
        '409':
          description: Ya cancelada, expirada o vencida, o con alguna entrada ya utilizada
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                yaCancelada:
                  value: { type: about:blank, title: Conflict, status: 409, detail: La reserva ya está CANCELADA, instance: /reservation-api/v1/reservations/3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42/cancel }
                utilizada:
                  value: { type: about:blank, title: Conflict, status: 409, detail: No se puede cancelar porque al menos una entrada ya fue utilizada, instance: /reservation-api/v1/reservations/3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42/cancel }
        '422':
          description: El partido ya empezó o terminó
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Unprocessable Content, status: 422, detail: No se puede cancelar porque el partido está FINALIZADO, instance: /reservation-api/v1/reservations/3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42/cancel }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /reservation-api/v1/reservations/{publicId}/tickets/pdf:
    get:
      tags: [Tickets]
      summary: Mis entradas en PDF (una por página, con QR)
      description: |
        Dueño de la reserva o ADMIN (HU-37). Un PDF tipo "pase de abordar": **una página por
        cada ticket `ACTIVO`**, con partido, estadio, fecha y hora, asiento, código de reserva y
        la imagen del código QR. Los tickets `ANULADO` no se imprimen.

        Si match-service no responde, el PDF se genera igual con "Partido #id".
        ⚠️ El QR es la credencial de entrada: quien tenga el PDF puede entrar con él.
      operationId: getTicketsPdf
      parameters:
        - $ref: '#/components/parameters/ReservationPublicId'
      responses:
        '200':
          description: Documento PDF
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="entradas-RES-2026-K7P4QX.pdf"' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No existe, o pertenece a otro cliente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: La reserva no tiene entradas activas (pendiente, cancelada o expirada)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Conflict, status: 409, detail: La reserva no tiene entradas activas para imprimir, instance: /reservation-api/v1/reservations/3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42/tickets/pdf }

  # ------------------------------------------------------------------ Mis reservas
  /reservation-api/v1/reservations/me:
    get:
      tags: [Mis reservas]
      summary: Historial de mis reservas
      description: |
        Solo rol **CLIENTE** (HU-20). Todas las reservas del cliente del token, de la más nueva a
        la más antigua y en cualquier estado, con los datos del partido.

        Los datos del partido se piden a match-service **una vez por partido distinto**. Si
        match-service no responde, la lista igual se devuelve con `match: null`
        (**degradación elegante**): el historial es del cliente y vive en este servicio.

        `seatIds` queda vacío en reservas canceladas o expiradas (los bloqueos se liberan); en las
        que se confirmaron, los asientos siguen visibles en `tickets[]`.
      operationId: getMyReservations
      responses:
        '200':
          description: Historial (lista vacía si no tiene reservas)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyReservationItem' }
              example:
                - reservation:
                    publicId: 3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42
                    code: RES-2026-K7P4QX
                    matchId: 1
                    status: CONFIRMADA
                    createdAt: '2026-10-21T14:30:00'
                    expiresAt: '2026-10-21T14:40:00'
                    confirmedAt: '2026-10-21T14:34:12'
                    cancelledAt: null
                    seatIds: [13, 14]
                    tickets:
                      - { publicId: 7a1d9c3e-2f4b-4e8a-b6c1-0d9e8f7a6b5c, seatId: 13, qrCode: 9f2c7d1a4b8e4f0a9c3d5e7f1a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b, status: ACTIVO }
                  match:
                    name: El Nacional vs Barcelona SC
                    matchDate: '2026-11-07'
                    matchTime: '15:30'
                    stadiumName: Estadio Olímpico Atahualpa
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El token no es de un CLIENTE (el ADMIN no tiene reservas propias). Sin cuerpo.

  /reservation-api/v1/reservations/me/pdf:
    get:
      tags: [Mis reservas]
      summary: Mis reservas en PDF
      description: |
        Solo rol **CLIENTE** (HU-20). El mismo historial como documento PDF descargable
        (`Content-Disposition: attachment; filename="mis-reservas.pdf"`): resumen por estado y una
        tabla con código, partido, fecha, estado y entradas. Generado con OpenPDF.

        Si match-service no responde, el PDF se genera igual y el partido aparece como
        "Partido #id (información no disponible)".
      operationId: getMyReservationsPdf
      responses:
        '200':
          description: Documento PDF
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="mis-reservas.pdf"' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El token no es de un CLIENTE. Sin cuerpo.

  # ------------------------------------------------------------------ Reportes
  /reservation-api/v1/reports/reservations:
    get:
      tags: [Reportes]
      summary: Reporte consolidado de reservas
      description: |
        Solo **ADMIN** (HU-21). Todos los filtros son opcionales y combinables.

        - `from` / `to`: rango de la **fecha en que se hizo la reserva** (`createdAt`), ambos
          inclusive. `to` incluye el día completo (hasta las 23:59:59).
        - `matchId`: un partido. `status`: un estado de reserva.

        **Resumen**: total de reservas, reservas por estado (todos los estados, aunque sean 0),
        entradas vendidas (`ACTIVO` + `UTILIZADO`) y entradas anuladas, siempre sobre las reservas
        filtradas.

        **Ocupación por partido y por sección**: para cada partido que aparece en el resultado,
        la ocupación **actual** = asientos vendidos (`RESERVED`) / capacidad del estadio (suma de
        sus secciones). No depende de los filtros de fecha o estado: es una foto del momento.
        La calcula match-service con los asientos vendidos que le envía este servicio.
        Si match-service no responde, el reporte sale igual con `match` y `occupancy` en `null`.
      operationId: getReservationsReport
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date, example: '2026-10-01' } }
        - { name: to, in: query, required: false, schema: { type: string, format: date, example: '2026-10-31' } }
        - { name: matchId, in: query, required: false, schema: { type: integer, format: int64, minimum: 1, example: 1 } }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ReservationStatus' }
      responses:
        '200':
          description: Reporte (con listas vacías si nada coincide)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReport' }
              example:
                filters: { from: '2026-10-01', to: '2026-10-31', matchId: null, status: null }
                generatedAt: '2026-10-22T17:30:00'
                summary:
                  totalReservations: 7
                  byStatus: { PENDIENTE: 1, CONFIRMADA: 3, CANCELADA: 2, EXPIRADA: 1 }
                  ticketsSold: 12
                  ticketsAnnulled: 2
                matches:
                  - matchId: 1
                    match: { name: El Nacional vs Barcelona SC, matchDate: '2026-11-07', matchTime: '15:30', stadiumName: Estadio Olímpico Atahualpa }
                    reservations: 4
                    occupancy:
                      capacity: 8460
                      occupied: 8
                      percentage: 0.1
                      sections:
                        - { name: Palco Occidental, sectionType: PALCOS, capacity: 200, occupied: 6, percentage: 3.0 }
                        - { name: Preferencia Occidental Norte, sectionType: PREFERENCIA, capacity: 800, occupied: 2, percentage: 0.3 }
                        - { name: Preferencia Occidental Sur, sectionType: PREFERENCIA, capacity: 800, occupied: 0, percentage: 0.0 }
                        - { name: Tribuna Oriental Norte, sectionType: TRIBUNAS, capacity: 1250, occupied: 0, percentage: 0.0 }
                        - { name: Tribuna Oriental Sur, sectionType: TRIBUNAS, capacity: 1250, occupied: 0, percentage: 0.0 }
                        - { name: General Norte, sectionType: GENERAL, capacity: 2080, occupied: 0, percentage: 0.0 }
                        - { name: General Sur, sectionType: GENERAL, capacity: 2080, occupied: 0, percentage: 0.0 }
        '400':
          description: Parámetro con formato inválido (fecha, estado o id)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El token no es de un ADMIN. Sin cuerpo.
        '422':
          description: '`from` es posterior a `to`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Unprocessable Content, status: 422, detail: La fecha inicial no puede ser posterior a la fecha final, instance: /reservation-api/v1/reports/reservations }

  /reservation-api/v1/reports/reservations/pdf:
    get:
      tags: [Reportes]
      summary: Reporte consolidado en PDF
      description: |
        Solo **ADMIN** (HU-21). El **mismo** reporte que `GET /reports/reservations`, con los mismos
        filtros, dibujado como PDF horizontal: tarjetas con los totales, reservas por estado y, por
        cada partido, la tabla de secciones con capacidad, vendidos, porcentaje y barra de ocupación.
        Como sale de la misma función, el JSON y el PDF nunca muestran números distintos.
      operationId: getReservationsReportPdf
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date, example: '2026-10-01' } }
        - { name: to, in: query, required: false, schema: { type: string, format: date, example: '2026-10-31' } }
        - { name: matchId, in: query, required: false, schema: { type: integer, format: int64, minimum: 1, example: 1 } }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ReservationStatus' }
      responses:
        '200':
          description: Documento PDF
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="reporte-reservas-2026-10-22.pdf"' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400':
          description: Parámetro con formato inválido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El token no es de un ADMIN. Sin cuerpo.
        '422':
          description: '`from` es posterior a `to`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reservation-api/v1/reports/matches/{matchId}/reservations:
    get:
      tags: [Reportes]
      summary: Reservas de un evento
      description: |
        Solo **ADMIN** (HU-28). Todas las reservas de un partido, de la más nueva a la más antigua,
        con el `clientId` del dueño. Ese id solo se expone aquí: las respuestas del cliente no lo llevan.
        `status` opcional para ver, por ejemplo, solo las confirmadas.
      operationId: getMatchReservations
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ReservationStatus' }
      responses:
        '200':
          description: Lista (vacía si el partido no tiene reservas)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    clientId: { type: integer, format: int64, example: 1 }
                    reservation: { $ref: '#/components/schemas/ReservationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El token no es de un ADMIN. Sin cuerpo.

  /reservation-api/v1/parameters:
    get:
      tags: [Configuración]
      summary: Parámetros del sistema
      description: |
        Solo **ADMIN** (HU-43). Devuelve todos los parámetros con su rango: `editable`, `min`, `max` y `unit`.
        `RESERVATION_CODE_PREFIX` es de solo lectura.
      operationId: getParameters
      responses:
        '200':
          description: Lista de parámetros
          content:
            application/json:
              example:
                - { code: MAX_TICKETS_PER_MATCH, value: '6', description: Máximo de entradas por cliente y partido, editable: true, min: 1, max: 10, unit: entradas }
                - { code: RESERVATION_CODE_PREFIX, value: RES, description: Prefijo del código legible de reserva, editable: false, min: null, max: null, unit: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El token no es de un ADMIN. Sin cuerpo.

  /reservation-api/v1/parameters/{code}:
    put:
      tags: [Configuración]
      summary: Cambiar el valor de un parámetro
      description: |
        Solo **ADMIN** (HU-43). El valor debe ser un entero dentro del rango del parámetro. Aplica a las
        reservas nuevas; las existentes conservan lo que tenían. El cambio queda en la auditoría.
      operationId: updateParameter
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, example: HOLD_MINUTES } }
      requestBody:
        required: true
        content:
          application/json:
            example: { value: '15' }
      responses:
        '200': { description: Parámetro actualizado }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El token no es de un ADMIN. Sin cuerpo.
        '404':
          description: No existe el parámetro
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: No es un entero, está fuera de rango o el parámetro es de solo lectura
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------ Tickets
  /reservation-api/v1/tickets/{publicId}/qr:
    get:
      tags: [Tickets]
      summary: Imagen del QR de un ticket
      description: |
        Cualquier usuario autenticado (HU-18). Devuelve un PNG de 300 × 300 con el código QR
        del ticket (generado con ZXing). Un CLIENTE solo ve los QR de sus tickets; el ADMIN, todos.
        Ticket ajeno → `404` (no `403`), por la misma razón que en las reservas.

        En Apidog, la pestaña de respuesta muestra la imagen directamente.
      operationId: getTicketQr
      parameters:
        - name: publicId
          in: path
          required: true
          description: '`publicId` del **ticket** (no de la reserva), tomado de `tickets[]` al confirmar'
          schema: { type: string, format: uuid, example: 7a1d9c3e-2f4b-4e8a-b6c1-0d9e8f7a6b5c }
      responses:
        '200':
          description: Imagen PNG del código QR
          content:
            image/png:
              schema: { type: string, format: binary }
        '400':
          description: El `publicId` no es un UUID válido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: El ticket no existe, o pertenece a otro cliente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Not Found, status: 404, detail: No existe el ticket 7a1d9c3e-2f4b-4e8a-b6c1-0d9e8f7a6b5c, instance: /reservation-api/v1/tickets/7a1d9c3e-2f4b-4e8a-b6c1-0d9e8f7a6b5c/qr }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en `POST /auth-api/v1/auth/login` de auth-service (puerto 8081)

  parameters:
    ReservationPublicId:
      name: publicId
      in: path
      required: true
      description: Identificador público (UUID) devuelto al crear la reserva
      schema: { type: string, format: uuid, example: 3f6c2a1e-8b4d-4c7a-9e21-5d0b7a9c1f42 }
    MatchId:
      name: matchId
      in: path
      required: true
      description: Id del partido en match-service
      schema: { type: integer, format: int64, minimum: 1, example: 1 }

  responses:
    ValidationError:
      description: Datos de entrada inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: La solicitud tiene campos inválidos
            instance: /reservation-api/v1/reservations
            errors:
              - { field: seatIds, message: el tamaño debe estar entre 0 y 6 }
    Unauthorized:
      description: Sin token, o token inválido o vencido. Sin cuerpo; encabezado `WWW-Authenticate`.
      headers:
        WWW-Authenticate: { schema: { type: string, example: Bearer } }
    ServiceUnavailable:
      description: match-service no responde (apagado o supera el tiempo de espera). No se guarda nada.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Service Unavailable, status: 503, detail: El servicio de partidos no está disponible. Intenta de nuevo en unos minutos, instance: /reservation-api/v1/reservations }

  schemas:
    MeResponse:
      type: object
      properties:
        username: { type: string, example: cvera }
        role: { type: string, enum: [ADMIN, CLIENTE], example: CLIENTE }
        clientId: { type: integer, format: int64, nullable: true, example: 2 }
        expiresAt: { type: string, format: date-time, example: '2026-10-21T20:15:00Z' }

    AvailabilityResponse:
      type: object
      properties:
        matchId: { type: integer, format: int64, example: 1 }
        matchStatus:
          type: string
          description: Estado del partido según match-service
          example: PROGRAMADO
        salesOpen:
          type: boolean
          description: Si hoy se puede reservar y confirmar (estado y hora de cierre, HU-40)
          example: true
        salesCloseAt:
          type: string
          format: date-time
          description: Hora de Ecuador en que cierra la venta online (inicio + SALES_CLOSE_OFFSET_MINUTES)
          example: '2026-11-07T15:40:00'
        occupiedSeats:
          type: array
          items: { $ref: '#/components/schemas/OccupiedSeat' }
        refreshSeconds: { type: integer, example: 5 }
        maxTicketsPerMatch: { type: integer, example: 6, description: 'Parámetro MAX_TICKETS_PER_MATCH (HU-43): el front lo usa como tope de selección' }

    OccupiedSeat:
      type: object
      properties:
        seatId: { type: integer, format: int64, example: 35 }
        status: { $ref: '#/components/schemas/SeatLockStatus' }

    SeatLockStatus:
      type: string
      enum: [HELD, RESERVED]
      description: '`HELD` retenido por una reserva pendiente; `RESERVED` vendido'

    CreateReservationRequest:
      type: object
      required: [matchId, seatIds]
      description: No lleva `clientId`; el cliente sale del token.
      properties:
        matchId: { type: integer, format: int64, minimum: 1, example: 1 }
        seatIds:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
          example: [13, 14]

    ReservationResponse:
      type: object
      properties:
        publicId: { type: string, format: uuid }
        code: { type: string, example: RES-2026-K7P4QX }
        matchId: { type: integer, format: int64, example: 1 }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        createdAt: { type: string, format: date-time, example: '2026-10-21T14:30:00' }
        expiresAt: { type: string, format: date-time, example: '2026-10-21T14:40:00' }
        confirmedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        seatIds:
          type: array
          items: { type: integer, format: int64 }
          example: [13, 14]
        tickets:
          type: array
          description: Vacío mientras la reserva está PENDIENTE; se llena al confirmar (HU-18)
          items: { $ref: '#/components/schemas/TicketResponse' }

    AdminReport:
      type: object
      properties:
        filters:
          type: object
          properties:
            from: { type: string, format: date, nullable: true }
            to: { type: string, format: date, nullable: true }
            matchId: { type: integer, format: int64, nullable: true }
            status: { type: string, nullable: true }
        generatedAt: { type: string, format: date-time }
        summary:
          type: object
          properties:
            totalReservations: { type: integer }
            byStatus: { type: object, additionalProperties: { type: integer } }
            ticketsSold: { type: integer }
            ticketsAnnulled: { type: integer }
        matches:
          type: array
          items:
            type: object
            properties:
              matchId: { type: integer, format: int64 }
              match:
                allOf: [ { $ref: '#/components/schemas/MatchSummary' } ]
                nullable: true
              reservations: { type: integer }
              occupancy:
                type: object
                nullable: true
                properties:
                  capacity: { type: integer }
                  occupied: { type: integer }
                  percentage: { type: number }
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        sectionType: { type: string }
                        capacity: { type: integer }
                        occupied: { type: integer }
                        percentage: { type: number }

    MyReservationItem:
      type: object
      properties:
        reservation: { $ref: '#/components/schemas/ReservationResponse' }
        match:
          allOf: [ { $ref: '#/components/schemas/MatchSummary' } ]
          nullable: true
          description: '`null` si match-service no respondió'

    MatchSummary:
      type: object
      properties:
        name: { type: string, example: El Nacional vs Barcelona SC }
        matchDate: { type: string, format: date, example: '2026-11-07' }
        matchTime: { type: string, example: '15:30' }
        stadiumName: { type: string, example: Estadio Olímpico Atahualpa }

    ReservationStatus:
      type: string
      enum: [PENDIENTE, CONFIRMADA, CANCELADA, EXPIRADA]

    TicketResponse:
      type: object
      properties:
        publicId: { type: string, format: uuid }
        seatId: { type: integer, format: int64, example: 13 }
        qrCode: { type: string, minLength: 64, maxLength: 64, description: 'Código aleatorio en hexadecimal; es lo que contiene el QR', example: 9f2c7d1a4b8e4f0a9c3d5e7f1a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b }
        status: { type: string, enum: [ACTIVO, UTILIZADO, ANULADO] }

    Problem:
      type: object
      description: Error en formato RFC 7807 (Problem Details)
      required: [title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Conflict }
        status: { type: integer, example: 409 }
        detail: { type: string, example: 'Estos asientos ya no están disponibles: [13]' }
        instance: { type: string, example: /reservation-api/v1/reservations }
        errors:
          type: array
