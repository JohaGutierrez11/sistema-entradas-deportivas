server {
    listen 80;

    # La aplicación React (archivos estáticos)
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El mismo trabajo que hacía el proxy de Vite, ahora con los nombres de Compose
    location /auth-api/        { proxy_pass http://auth-service:8081; }
    location /match-api/       { proxy_pass http://match-service:8082; }
    location /reservation-api/ { proxy_pass http://reservation-service:8083; }
}