server:
  port: 8082

spring:
  application:
    name: match-service
  datasource:
    url: jdbc:postgresql://localhost:5433/match_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: method
  web:
    locale: es
    locale-resolver: fixed
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-cambiar-en-produccion-0123456789abcdef}
  internal-key: ${INTERNAL_API_KEY:dev-internal-key-cambiar-en-produccion}