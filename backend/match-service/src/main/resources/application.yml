server:
  port: 8082

spring:
  application:
    name: match-service
  datasource:
    url: jdbc:postgresql://localhost:5433/match_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: method
  web:
    locale: es
    locale-resolver: fixed