server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  web:
    locale: es
    locale-resolver: fixed
  mail:
    host: localhost
    port: 1025

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-cambiar-en-produccion-0123456789abcdef}
    expiration-minutes: 60